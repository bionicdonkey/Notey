name: Debian package

# A .deb for every commit on main, and for every `v*` tag, which also publishes a GitHub release.
# The tests gate the package: nothing is built unless scripts/ci.sh passes.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # attaching the package to a release

# A release commit arrives twice: as a push to main and as a tag. Build each ref once, and let a
# tag run cancel the branch run for the same commit.
concurrency:
  group: deb-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  deb:
    # Put [skip build] in the newest commit message of a push to main to skip this run (a typo
    # fix, a wording change). A tag always builds, so a release can never be skipped by accident,
    # and "Run workflow" always builds. See docs/testing.md.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || !contains(github.event.head_commit.message, '[skip build]')
    # Ubuntu 24.04 is the baseline (Zorin OS 18). The Depends line is computed from the libraries
    # the binary links, so building on the oldest supported release gives a package that installs
    # there and on anything newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install the build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev binutils xvfb \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev

      - name: Install Rust (the version pinned in rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component clippy
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check, lint and test
        run: sh scripts/ci.sh

      - name: Read the crate version
        id: crate
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.crate.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${{ steps.crate.outputs.version }} in Cargo.toml" >&2
            exit 1
          fi

      - name: Build the package
        run: packaging/deb/build-deb.sh dist

      - name: Describe the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: target/ci-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: notey-${{ steps.crate.outputs.version }}-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # Re-running a tag replaces the package on the release that already exists.
            gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.deb \
              --title "NoteyMcNoteface ${{ steps.crate.outputs.version }}" \
              --generate-notes
          fi
